name: Fmt and Clippy

# This job runs rustfmt and clippy linting,

on:
  push:
    branches: main

  pull_request:
    branches: main

  workflow_dispatch: # allows manual trigger

env:
  RUST_FMT: nightly-2023-04-01-x86_64-unknown-linux-gnu
  RUST_VERSION: 1.85
  CARGO_CONCORDIUM_VERSION: "4.2.0"


  rust_fmt:
    name: Running rust fmt for formatting
    needs: changes
    # Don't run on draft pull requests, or if there are no changes in Rust files. 
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest  
    strategy:
      matrix:
        paths: ${{ fromJSON(needs.changes.outputs.paths) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run cargo fmt
        run: |
          rustup +${{ env.RUST_FMT_VERSION }} component add rustfmt
          cargo +${{ env.RUST_FMT_VERSION }} fmt --check

  clippy:
    name: Running Clippy for linting and dependency validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install and run Clippy
        run: |
          rustup component add clippy
          cargo clippy --locked --all-targets --all-features --no-deps -- -D warnings

